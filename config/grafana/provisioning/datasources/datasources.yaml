apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: Loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000

  - name: SpeedtestDB
    type: postgres
    uid: SpeedtestDB
    access: proxy
    url: SpeedTest-TRACKER-DB:5432
    user: speedtestuser
    secureJsonData:
      password: speedtestpass
    jsonData:
      database: speedtest
      sslmode: disable
      postgresVersion: 1500
    editable: false
